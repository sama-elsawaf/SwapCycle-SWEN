name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed secrets or env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "::error::An .env file is committed. Remove it and rotate any secrets it contained."
            exit 1
          fi
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::A private key is committed."
            exit 1
          fi
      - name: No uploaded files committed
        run: |
          if git ls-files | grep -E '(^|/)uploads/'; then
            echo "::error::Uploaded files must never be committed."
            exit 1
          fi

  migrations:
    name: Database migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swapcycle_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d swapcycle_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci-only-password
      PGDATABASE: swapcycle_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          for file in $(ls database/migrations/*.sql | sort); do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Apply development seed
        if: hashFiles('database/seeds/dev_seed.sql') != ''
        run: psql -v ON_ERROR_STOP=1 -q -f database/seeds/dev_seed.sql

  backend:
    name: Backend build and GoogleTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (compiles with -Werror and runs GoogleTest)
        run: >
          docker build backend -f backend/DockerFile
          --build-arg BUILD_TYPE=Release
          --build-arg RUN_TESTS=ON
          --build-arg WARNINGS_AS_ERRORS=ON
          -t swapcycle-backend:ci

  frontend:
    name: Frontend tests, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Unit tests (Vitest)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
